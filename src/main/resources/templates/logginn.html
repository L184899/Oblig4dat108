<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/simple.css">
<title>Logg inn</title>
</head>
<body>
	<h2>Logg inn</h2>

    <p th:if="${feilmelding}" th:text="${feilmelding}" style="color:red"></p>

    <form method="post" action="/innlogging">
        <fieldset>
            <label for="mobil">Mobil</label>
            <input type="text" id="mobil" name="mobil" required />

            <label for="passord">Passord</label>
            <input type="password" id="passord" name="passord" required />

            <br/><br/>
            <button type="submit">Logg inn</button>
        </fieldset>
    </form>

    <p><a href="/paamelding">Ikke påmeldt? Meld deg på her</a></p>

</body>
</html>
