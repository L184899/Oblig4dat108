<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/simple.css">
	<title>Deltagerliste</title>
</head>
<body>
    <p>Innlogget som: <span th:text="${innlogget.mobil} + ' / ' + ${innlogget.fulltNavn}"></span></p>

	<h2>Deltagerliste</h2>
	<table>
		<tr>
			<th>Kjønn</th>
			<th align="left">Navn</th>
			<th align="left">Mobil</th>
		</tr>

        <tr th:each="d : ${deltagere}"
            th:style="${d.mobil == innlogget.mobil} ? 'background-color:#aaffaa'">
            <td align="center" th:utext="${d.kjonnsymbol}"></td>
            <td th:text="${d.fulltNavn}"></td>
            <td th:text="${d.mobilFormatert}"></td>
        </tr>

	</table>
	<br>

    <form method="post" action="/utlogging">
        <button type="submit">Logg ut</button>
    </form>

    <script th:inline="javascript">
        const startAntall = /*[[${#lists.size(deltagere)}]]*/ 0;
        setInterval(async () => {
          const r = await fetch('/deltagerliste/antall');
          if (r.status === 401) { location.href = '/innlogging'; return; }
          if ((await r.json()) !== startAntall) location.reload();
        }, 5000);
    </script>



</body>
</html>
